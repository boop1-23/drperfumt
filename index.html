<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متجر العطور</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0d0b;--card:#1a1714;--card2:#221e1a;--line:#2f2a24;--gold:#d4a95a;--gold2:#f0d398;--text:#f3ece2;--muted:#a39a8d;--green:#25d366;--red:#e5675b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;background-image:radial-gradient(circle at 80% -10%,rgba(212,169,90,.15),transparent 45%)}
button{font-family:inherit;cursor:pointer;border:none}
header{position:sticky;top:0;z-index:20;background:rgba(15,13,11,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1150px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.logo{font-family:'Amiri',serif;font-size:26px;color:var(--gold2)}
.cart-btn{background:var(--gold);color:#1a1208;font-weight:800;padding:10px 16px;border-radius:12px;display:flex;gap:8px;align-items:center;font-size:15px}
.cart-btn .count{background:#1a1208;color:var(--gold2);min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;font-size:12px;padding:0 6px}
.bump{animation:bump .35s}@keyframes bump{50%{transform:scale(1.12)}}
.hero{text-align:center;padding:30px 16px 6px}
.hero h1{font-family:'Amiri',serif;font-size:clamp(30px,6vw,44px);color:var(--gold2)}
.hero p{color:var(--muted);margin-top:6px}
.tools{max-width:1150px;margin:16px auto 0;padding:0 16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.search{flex:1 1 240px;max-width:380px;background:var(--card);border:1px solid var(--line);color:var(--text);padding:11px 14px;border-radius:12px;font-family:inherit;font-size:15px;outline:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--card);color:var(--muted);border:1px solid var(--line);padding:9px 15px;border-radius:999px;font-size:14px}
.chip.on{background:var(--gold);color:#1a1208;font-weight:700}
.grid{max-width:1150px;margin:20px auto 60px;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.art{height:190px;display:grid;place-items:center;position:relative;overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.55);color:var(--gold2);font-size:12px;padding:4px 10px;border-radius:999px}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.name{font-size:20px;font-weight:800}
.desc{color:var(--muted);font-size:13.5px;line-height:1.6}
.notes{display:flex;flex-direction:column;gap:5px;font-size:13px;background:rgba(0,0,0,.25);border-radius:12px;padding:9px 11px}
.notes b{color:var(--gold);margin-left:4px}
.sizes{display:flex;gap:6px;flex-wrap:wrap}
.size{flex:1;min-width:70px;background:transparent;border:1px solid var(--line);color:var(--text);padding:7px 4px;border-radius:10px;font-size:13px;line-height:1.3}
.size span{display:block;color:var(--muted);font-size:11.5px}
.size.on{border-color:var(--gold);background:rgba(212,169,90,.12)}
.buy{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:10px}
.price{font-size:19px;font-weight:800;color:var(--gold2)}
.add{background:var(--gold);color:#1a1208;font-weight:800;padding:10px 16px;border-radius:12px;font-size:14px}
.msg{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.25s;z-index:40}
.shade.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(420px,100%);background:#141210;z-index:50;transform:translateX(-102%);transition:transform .3s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}
.x{background:var(--card);color:var(--text);width:36px;height:36px;border-radius:10px;font-size:18px}
.items{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.item .info{flex:1}.item .info span{color:var(--muted);font-size:12.5px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:8px;background:var(--card2);color:var(--text);border:1px solid var(--line)}
.del{background:none;color:var(--red);font-size:12px}
.dfoot{border-top:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.dfoot input,.dfoot textarea{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:10px;font-family:inherit;font-size:16px;outline:none}
.total{display:flex;justify-content:space-between;font-size:17px;font-weight:800}
.wa{background:var(--green);color:#04210f;font-weight:800;font-size:16px;padding:13px;border-radius:12px}
.wa:disabled{opacity:.45}
.err{color:var(--red);font-size:12.5px;min-height:16px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1208;font-weight:700;padding:10px 18px;border-radius:12px;opacity:0;transition:.3s;z-index:60;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo" id="storeName">متجر العطور</div>
  <button class="cart-btn" id="openCart">🛒 السلة <span class="count" id="count">0</span></button>
</div></header>
<section class="hero"><h1>اختر عطرك المميّز</h1><p>اختر العطر والحجم، أضفه للسلة وأرسل طلبك على الواتساب</p></section>
<div class="tools"><input class="search" id="search" placeholder="ابحث عن عطر أو مكوّن…"><div class="chips" id="chips"></div></div>
<main class="grid" id="grid"><div class="msg">جارٍ التحميل…</div></main>

<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer">
  <div class="dhead"><h2>🛒 سلة الطلبات</h2><button class="x" id="closeCart">✕</button></div>
  <div class="items" id="items"></div>
  <div class="dfoot">
    <div class="total"><span>المجموع</span><span id="total">0</span></div>
    <input id="cName" placeholder="اسمك *">
    <input id="cPhone" placeholder="رقم هاتفك *" inputmode="tel">
    <input id="cAddr" placeholder="العنوان (المحافظة / المنطقة) *">
    <textarea id="cNote" rows="2" placeholder="ملاحظات (اختياري)"></textarea>
    <div class="err" id="err"></div>
    <button class="wa" id="sendWa">إرسال الطلب عبر واتساب 💬</button>
  </div>
</aside>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, getDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./config.js";

const db = getFirestore(initializeApp(firebaseConfig));
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = {name:"متجر العطور", whatsapp:"", currency:"د.ع"};
const fmt = n=>Number(n).toLocaleString('en-US')+" "+S.currency;
let P = [], cat="الكل", query="", chosen={};
let cart=[]; try{cart=JSON.parse(localStorage.getItem('cart2')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('cart2',JSON.stringify(cart))}catch(e){}};

function bottle(color="#7a4a1e",w=90){return `<svg width="${w}" viewBox="0 0 100 130"><rect x="40" y="6" width="20" height="16" rx="3" fill="#d4a95a"/><rect x="44" y="20" width="12" height="10" fill="#b8913f"/><rect x="16" y="30" width="68" height="94" rx="16" fill="${esc(color)}"/><rect x="28" y="62" width="44" height="30" rx="4" fill="rgba(0,0,0,.25)" stroke="#d4a95a"/><rect x="24" y="38" width="8" height="70" rx="4" fill="rgba(255,255,255,.22)"/></svg>`}

getDoc(doc(db,"settings","store")).then(d=>{ if(d.exists()) S={...S,...d.data()}; $('#storeName').textContent=S.name; document.title=S.name; renderGrid(); renderCart(); }).catch(()=>{});

onSnapshot(collection(db,"perfumes"), snap=>{
  P = snap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.available!==false && p.sizes && p.sizes.length)
       .sort((a,b)=>(a.order||0)-(b.order||0));
  // تحديث أسعار السلة إذا تغيّرت
  cart = cart.filter(i=>{const p=P.find(x=>x.id===i.id); const s=p&&p.sizes.find(z=>z.label===i.size); if(s){i.price=s.price;i.name=p.name;return true} return false});
  save(); renderChips(); renderGrid(); renderCart();
}, e=>{ $('#grid').innerHTML=`<div class="msg">تعذّر تحميل العطور. تأكد من إعدادات Firebase.</div>`; });

function renderChips(){
  const cats=["الكل",...new Set(P.map(p=>p.cat).filter(Boolean))];
  $('#chips').innerHTML=cats.map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
}
function renderGrid(){
  const q=query.trim();
  const list=P.filter(p=>(cat==="الكل"||p.cat===cat)&&(!q||[p.name,p.desc,p.top,p.heart,p.base].join(' ').includes(q)));
  if(!list.length){$('#grid').innerHTML=`<div class="msg">${P.length?'لا توجد نتائج':'لا توجد عطور حالياً'}</div>`;return}
  $('#grid').innerHTML=list.map(p=>{
    const sel=p.sizes.find(s=>s.label===chosen[p.id])||p.sizes[0]; chosen[p.id]=sel.label;
    return `<article class="card">
      <div class="art" style="background:radial-gradient(circle at 50% 60%, ${esc(p.color||'#7a4a1e')}55, transparent 70%)">
        ${p.tag?`<span class="tag">${esc(p.tag)}</span>`:''}${p.image?`<img src="${esc(p.image)}" alt="">`:bottle(p.color)}
      </div>
      <div class="body">
        <div><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.cat)}${p.desc?' • '+esc(p.desc):''}</div></div>
        ${(p.top||p.heart||p.base)?`<div class="notes">${p.top?`<div><b>المقدمة:</b>${esc(p.top)}</div>`:''}${p.heart?`<div><b>القلب:</b>${esc(p.heart)}</div>`:''}${p.base?`<div><b>القاعدة:</b>${esc(p.base)}</div>`:''}</div>`:''}
        <div class="sizes">${p.sizes.map(s=>`<button class="size ${s.label===sel.label?'on':''}" data-id="${p.id}" data-s="${esc(s.label)}">${esc(s.label)}<span>${fmt(s.price)}</span></button>`).join('')}</div>
        <div class="buy"><div class="price">${fmt(sel.price)}</div><button class="add" data-add="${p.id}">+ أضف للسلة</button></div>
      </div></article>`}).join('');
}
function renderCart(){
  const n=cart.reduce((a,i)=>a+i.qty,0), sum=cart.reduce((a,i)=>a+i.qty*i.price,0);
  $('#count').textContent=n; $('#total').textContent=fmt(sum);
  $('#items').innerHTML=cart.length?cart.map((i,k)=>`<div class="item"><div class="info"><b>${esc(i.name)}</b><br><span>${esc(i.size)} • ${fmt(i.price)}</span><br><button class="del" data-del="${k}">حذف</button></div><div class="qty"><button data-inc="${k}">+</button><b>${i.qty}</b><button data-dec="${k}">−</button></div></div>`).join(''):`<p style="text-align:center;color:var(--muted);padding:40px">السلة فارغة</p>`;
}
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1600)};
const openC=v=>{$('#drawer').classList.toggle('on',v);$('#shade').classList.toggle('on',v)};

document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return; const d=t.dataset;
  if(d.c){cat=d.c;renderChips();renderGrid()}
  else if(d.s){chosen[d.id]=d.s;renderGrid()}
  else if(d.add){const p=P.find(x=>x.id===d.add), s=p.sizes.find(z=>z.label===chosen[p.id]);
    const ex=cart.find(i=>i.id===p.id&&i.size===s.label); ex?ex.qty++:cart.push({id:p.id,name:p.name,size:s.label,price:s.price,qty:1});
    save();renderCart();const c=$('#openCart');c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump');toast(`تمت إضافة ${p.name}`)}
  else if(d.inc){cart[d.inc].qty++;save();renderCart()}
  else if(d.dec){const i=cart[d.dec];i.qty>1?i.qty--:cart.splice(d.dec,1);save();renderCart()}
  else if(d.del){cart.splice(d.del,1);save();renderCart()}
});
$('#openCart').onclick=()=>openC(true); $('#closeCart').onclick=()=>openC(false); $('#shade').onclick=()=>openC(false);
$('#search').oninput=e=>{query=e.target.value;renderGrid()};

$('#sendWa').onclick=async()=>{
  const name=$('#cName').value.trim(), phone=$('#cPhone').value.trim(), addr=$('#cAddr').value.trim(), note=$('#cNote').value.trim();
  if(!cart.length) return $('#err').textContent='السلة فارغة';
  if(!name||!phone||!addr) return $('#err').textContent='املأ الاسم ورقم الهاتف والعنوان';
  if(!S.whatsapp) return $('#err').textContent='رقم واتساب المتجر غير مضبوط بعد';
  $('#err').textContent=''; const btn=$('#sendWa'); btn.disabled=true; btn.textContent='جارٍ الإرسال…';
  const num=String(Date.now()).slice(-6), sum=cart.reduce((s,i)=>s+i.qty*i.price,0);
  const order={num,name:name.slice(0,80),phone:phone.slice(0,30),address:addr.slice(0,200),note:note.slice(0,300),
    items:cart.map(i=>({name:i.name,size:i.size,price:i.price,qty:i.qty})),total:sum,status:"جديد",createdAt:serverTimestamp()};
  try{ await Promise.race([addDoc(collection(db,"orders"),order), new Promise(r=>setTimeout(r,5000))]); }catch(e){}
  let msg=`🛍️ *طلب جديد #${num} - ${S.name}*\n\n`;
  cart.forEach((i,k)=>msg+=`${k+1}. ${i.name} - ${i.size}\n   ${i.qty} × ${fmt(i.price)} = ${fmt(i.qty*i.price)}\n`);
  msg+=`\n💰 *المجموع: ${fmt(sum)}*\n\n👤 ${name}\n📞 ${phone}\n📍 ${addr}`+(note?`\n📝 ${note}`:'');
  cart=[];save();renderCart();openC(false);btn.disabled=false;btn.textContent='إرسال الطلب عبر واتساب 💬';
  location.href=`https://wa.me/${S.whatsapp}?text=${encodeURIComponent(msg)}`;
};
renderCart();
</script>
</body>
</html>
